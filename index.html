<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boomdle — Wordle with Explosions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Full-screen explosion / particle canvas sits above everything -->
  <canvas id="fx"></canvas>

  <header class="topbar">
    <div class="topbar-actions">
      <button id="statsBtn" class="icon-btn" title="Stats" aria-label="Stats">📊</button>
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    </div>
    <h1 class="logo">💥 BOOMDLE 💥</h1>
    <p class="tagline">Wordle, but everything explodes.</p>
  </header>

  <main>
    <div id="board" class="board" aria-label="game board"></div>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <div id="keyboard" class="keyboard" aria-label="keyboard"></div>

    <button id="reset" class="reset-btn" hidden>💣 New Game</button>
  </main>

  <!-- Stats modal -->
  <div id="statsModal" class="modal" hidden>
    <div class="modal-card">
      <button id="statsClose" class="modal-close" aria-label="Close">✕</button>
      <h2 class="modal-title">📊 Statistics</h2>
      <div class="stat-grid">
        <div class="stat"><b id="stPlayed">0</b><span>Played</span></div>
        <div class="stat"><b id="stWin">0</b><span>Win %</span></div>
        <div class="stat"><b id="stStreak">0</b><span>🔥 Streak</span></div>
        <div class="stat"><b id="stMax">0</b><span>Max Streak</span></div>
      </div>
      <h3 class="dist-title">Guess Distribution</h3>
      <div id="dist" class="dist"></div>
      <button id="statsPlay" class="reset-btn">💣 New Game</button>
    </div>
  </div>

  <footer class="footer">
    <span>Guess the 5-letter word in 6 tries.</span>
  </footer>

  <script src="words.js"></script>
  <script src="explosions.js"></script>
  <script src="script.js"></script>
</body>
</html>
